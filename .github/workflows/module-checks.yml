name: Module checks (reusable)

# Called from a module's own workflow; see docs/module-ci.md. Fails when the vendored core differs from the pin, then runs the
# module's syntax check, lint, type check and tests. Each step can be switched off with an input while a module migrates.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      core-dir:
        description: Vendored folder (relative to the module root)
        type: string
        default: vendor/wanderers-core
      core-lock:
        description: Lock file
        type: string
        default: wanderers-core.lock.json
      remote:
        description: Also check the lock against the published core release (needs network; a local pin only warns)
        type: boolean
        default: true
      lint:
        type: boolean
        default: true
      types:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: Core pin, lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      # The checker comes from core itself at the pinned tag, not from the module's vendored copy, so an edited vendored
      # vendor.mjs can't approve itself. A local (unreleased) pin has no tag yet: its own copy checks it, with a warning.
      - name: Read the pin
        id: pin
        env:
          CORE_LOCK: ${{ inputs.core-lock }}
        # Values from the lock file are data from the module (or a pull request): they go to later steps through env, never into
        # a script, and are checked against a strict pattern first.
        run: |
          test -f "$CORE_LOCK" || { echo "::error title=wanderers-core::no $CORE_LOCK in this module"; exit 1; }
          VERSION="$(jq -r '.version // ""' "$CORE_LOCK")"
          SOURCE="$(jq -r '.source // ""' "$CORE_LOCK")"
          if [[ ! "$SOURCE" =~ ^(release|local)$ ]]; then echo "::error title=wanderers-core::the lock's source should be release or local"; exit 1; fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then echo "::error title=wanderers-core::the lock's version should be X.Y.Z"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
      - name: Fetch core's checker at the pinned version
        if: steps.pin.outputs.source == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cocoomg11/wanderers-core
          ref: v${{ steps.pin.outputs.version }}
          path: .wanderers-core-checker
          persist-credentials: false
      - name: Vendored wanderers-core matches its pin
        env:
          CORE_DIR: ${{ inputs.core-dir }}
          CORE_LOCK: ${{ inputs.core-lock }}
          PIN_SOURCE: ${{ steps.pin.outputs.source }}
          REMOTE: ${{ inputs.remote && '--remote' || '' }}
        run: |
          TOOL="$CORE_DIR/vendor.mjs"
          if [ "$PIN_SOURCE" = "release" ]; then TOOL=".wanderers-core-checker/tools/vendor.mjs"; fi
          node "$TOOL" verify --dir "$CORE_DIR" --lock "$CORE_LOCK" $REMOTE
          rm -rf .wanderers-core-checker
      - name: Install dev tools
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; elif [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Syntax check
        run: npm run check
      - name: ESLint
        if: inputs.lint
        run: npm run lint
      - name: JSDoc type check
        if: inputs.types
        run: npm run types
      - name: Unit tests
        run: npm test
