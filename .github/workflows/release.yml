name: Release

# The user publishes a GitHub release with a tag vMAJOR.MINOR.PATCH (agents never tag or publish). The build job (read-only) checks
# the tag and package.json agree, runs every check again with the committed lockfile (npm ci) and builds wanderers-core-X.Y.Z.json
# (every vendored file plus its content hash) with its .sha256. A separate upload job, the only one with write access, attaches
# both to the release and checks the published asset downloads and verifies. Modules fetch it with `vendor.mjs install X.Y.Z`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build the bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - name: Check the release tag format
        if: github.event_name == 'release'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Bad release tag::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (for example v0.2.0). Delete the release and tag, then publish again with a tag like v0.2.0."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME OK"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches package.json and CORE_VERSION
        if: github.event_name == 'release'
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="$(jq -r .version package.json)"
          C="$(sed -nE 's/^export const CORE_VERSION = "([^"]+)";/\1/p' src/version.mjs)"
          if [ "$V" != "$P" ] || [ "$V" != "$C" ]; then
            echo "::error title=Version mismatch::tag $V, package.json $P, CORE_VERSION $C. Bump both in a commit on main, then release again."
            exit 1
          fi
          grep -q "^## $V" CHANGELOG.md || { echo "::error title=No changelog::CHANGELOG.md has no '## $V' section"; exit 1; }

      - name: Install the pinned dev tools (committed lockfile)
        run: |
          test -f package-lock.json || { echo "::error title=No lockfile::package-lock.json is missing"; exit 1; }
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Checks
        run: |
          npm run check
          npm run lint
          npm run types
          npm test

      - name: Build the bundle
        id: bundle
        run: |
          node tools/vendor.mjs bundle --out dist
          ls -l dist
          V="$(jq -r .version package.json)"
          test -f "dist/wanderers-core-$V.json" && test -f "dist/wanderers-core-$V.json.sha256"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "::notice title=wanderers-core $V::$(cat dist/wanderers-core-$V.json.sha256)"

      - name: Keep the bundle for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wanderers-core-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload the release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wanderers-core-bundle
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          test "v$V" = "$GITHUB_REF_NAME" || { echo "::error::bundle version $V doesn't match tag $GITHUB_REF_NAME"; exit 1; }
          sha256sum "dist/wanderers-core-$V.json"
          gh release upload "$GITHUB_REF_NAME" "dist/wanderers-core-$V.json" "dist/wanderers-core-$V.json.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: Check the published asset downloads and verifies
    needs: [build, upload]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the published asset into an empty module and verify it
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p /tmp/mod && cd /tmp/mod
          for i in 1 2 3 4 5; do node "$GITHUB_WORKSPACE/tools/vendor.mjs" install "$V" --repo "$GITHUB_REPOSITORY" && break; sleep 10; done
          node vendor/wanderers-core/vendor.mjs verify --remote --repo "$GITHUB_REPOSITORY"
